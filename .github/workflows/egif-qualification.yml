name: EGIF qualification

on:
  push:
    branches:
      - agent/egif-qualification
    paths:
      - 'qualification/egif/**'
      - '.github/workflows/egif-qualification.yml'
      - 'src/egif_parser_dau.py'
      - 'src/egif_generator_dau.py'
      - 'src/cgif_parser_dau.py'
      - 'src/cgif_generator_dau.py'
      - 'src/egi_core_dau.py'
      - 'src/canonical_signature.py'
  pull_request:
    paths:
      - 'qualification/egif/**'
      - '.github/workflows/egif-qualification.yml'
      - 'src/egif_parser_dau.py'
      - 'src/egif_generator_dau.py'
      - 'src/cgif_parser_dau.py'
      - 'src/cgif_generator_dau.py'
      - 'src/egi_core_dau.py'
      - 'src/canonical_signature.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egif:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run bounded EGIF/CGIF qualification
        run: uv run python qualification/egif/qualification.py
      - name: Print receipt hash
        run: cat qualification/egif/evidence/receipt.sha256
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: arisbe-egif-qualification
          path: qualification/egif/evidence
          if-no-files-found: error

  independent-cgif:
    name: Independent Cogitant and Amine cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native and virtual-X prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ unzip xvfb xauth openjdk-17-jdk
      - name: Cross-check frozen EGIF-origin CGIF vectors
        run: bash qualification/egif/independent_crosscheck.sh
      - name: Print independent receipt
        if: always()
        run: cat qualification/egif/evidence/independent/receipt.json || true
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arisbe-egif-independent-cgif
          path: qualification/egif/evidence/independent
          if-no-files-found: error
